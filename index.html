<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestor Documental de la Escuela Básica G-733 Chorombo Bajo - administración de memos, oficios, citaciones, acuerdos, reuniones y permisos.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%231f5f8b%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 font-family=%27Arial%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3EG%3C/text%3E%3C/svg%3E">
  <title>Gestor Documental · Escuela G-733 Chorombo Bajo</title>

  <!-- Framework de UI: Bootstrap 5 (grid responsive, componentes accesibles).
       Se incluye localmente (vendor/) para que la app funcione sin conexión a internet. -->
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Enlace para saltar al contenido (accesibilidad, WCAG 2.4.1) -->
  <a class="visually-hidden-focusable skip-link" href="#contenido-principal">Saltar al contenido principal</a>

  <!-- Componente: Navbar -->
  <header id="navbar"></header>

  <main id="contenido-principal" class="container py-4" tabindex="-1">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 mb-0">Documentos institucionales</h1>
        <p class="text-body-secondary mb-0 small" id="resumen-listado" aria-live="polite">Cargando…</p>
      </div>
      <button type="button" class="btn btn-primary" id="btn-nuevo">
        <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Nuevo documento
      </button>
    </div>

    <!-- Componente: Filtros -->
    <section id="filtros" aria-label="Búsqueda y filtros"></section>

    <!-- Componente: Listado -->
    <section id="listado" aria-label="Listado de documentos" class="mt-3"></section>
  </main>

  <footer class="border-top py-3 mt-4">
    <div class="container small text-body-secondary d-flex flex-wrap justify-content-between gap-2">
      <span>Escuela Básica G-733 Chorombo Bajo · Comuna de María Pinto</span>
      <span id="estado-api" aria-live="polite"></span>
    </div>
  </footer>

  <!-- Contenedores de componentes flotantes -->
  <div id="modales"></div>
  <div id="toasts" class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite" aria-atomic="true"></div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
